<svg xmlns="http://www.w3.org/2000/svg" width="980" height="720" viewBox="0 0 980 720" role="img" aria-label="peerlink: one approved run between you, Grok Bot and your Mac">
<style>
  .bg { fill: #fafaf9; stroke: #e7e5e4; }
  .t { fill: #1c1917; font: 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif; }
  .h { font-size: 17px; font-weight: 650; }
  .m { fill: #57534e; font-size: 13px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13.5px; }
  .lane { fill: #ffffff; stroke: #d6d3d1; }
  .life { stroke: #d6d3d1; stroke-width: 1.5; stroke-dasharray: 4 5; }
  .net { stroke: #0f766e; fill: none; stroke-width: 2; }
  .tg { stroke: #2481cc; fill: none; stroke-width: 2; }
  .bell { stroke: #c2410c; fill: none; stroke-width: 2; stroke-dasharray: 7 5; }
  .chat { stroke: #78716c; fill: none; stroke-width: 2; }
  .dot-net { fill: #0f766e; } .dot-tg { fill: #2481cc; } .dot-bell { fill: #c2410c; } .dot-chat { fill: #78716c; }
  .num { fill: #fff; font: 600 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .run { fill: #f0fdfa; stroke: #99f6e4; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1c1917; stroke: #44403c; }
    .t { fill: #f5f5f4; } .m { fill: #a8a29e; }
    .lane { fill: #292524; stroke: #57534e; }
    .life { stroke: #57534e; }
    .net { stroke: #2dd4bf; } .dot-net { fill: #0d9488; }
    .tg { stroke: #5aa9e6; } .dot-tg { fill: #2481cc; }
    .bell { stroke: #fb923c; } .dot-bell { fill: #c2410c; }
    .chat { stroke: #a8a29e; } .dot-chat { fill: #78716c; }
    .run { fill: #042f2e; stroke: #115e59; }
  }
</style>
<rect class="bg" x="0.5" y="0.5" width="979" height="719" rx="16"/>
<line class="life" x1="150" y1="132" x2="150" y2="624"/>
<rect class="lane" x="35" y="40" width="230" height="62" rx="10"/>
<text class="t h" x="150" y="67" text-anchor="middle">You</text>
<text class="t m" x="150" y="89" text-anchor="middle">Telegram + Grok chat</text>
<line class="life" x1="490" y1="132" x2="490" y2="624"/>
<rect class="lane" x="375" y="40" width="230" height="62" rx="10"/>
<text class="t h" x="490" y="67" text-anchor="middle">Grok Bot</text>
<text class="t m" x="490" y="89" text-anchor="middle">cloud computer</text>
<line class="life" x1="830" y1="132" x2="830" y2="624"/>
<rect class="lane" x="715" y="40" width="230" height="62" rx="10"/>
<text class="t h" x="830" y="67" text-anchor="middle">Your Mac</text>
<text class="t m" x="830" y="89" text-anchor="middle">peerlink</text>
<path class="net" d="M496 180 H821"/><path class="dot-net" d="M828 180 l-10 -5 v10 z"/><circle class="dot-net" cx="536" cy="165" r="10"/><text class="num" x="536" y="169" text-anchor="middle">1</text><text class="t" x="673" y="170" text-anchor="middle">submit ask · tailnet, one port</text>
<path class="tg" d="M824 242 H159"/><path class="dot-tg" d="M152 242 l10 -5 v10 z"/><circle class="dot-tg" cx="370" cy="227" r="10"/><text class="num" x="370" y="231" text-anchor="middle">2</text><text class="t" x="503" y="232" text-anchor="middle">the request + a one-time code</text>
<path class="chat" d="M156 304 H481"/><path class="dot-chat" d="M488 304 l-10 -5 v10 z"/><circle class="dot-chat" cx="236" cy="289" r="10"/><text class="num" x="236" y="293" text-anchor="middle">3</text><text class="t" x="333" y="294" text-anchor="middle">“the code is 482913”</text>
<path class="net" d="M496 366 H821"/><path class="dot-net" d="M828 366 l-10 -5 v10 z"/><circle class="dot-net" cx="573" cy="351" r="10"/><text class="num" x="573" y="355" text-anchor="middle">4</text><text class="t mono" x="673" y="356" text-anchor="middle">approve &lt;run&gt; 482913</text>
<rect class="run" x="665" y="396" width="285" height="62" rx="10"/>
<circle class="dot-net" cx="687" cy="427" r="10"/><text class="num" x="687" y="431" text-anchor="middle">5</text>
<text class="t" x="705" y="422">runs Pi / Codex on your Mac,</text><text class="t" x="705" y="443">keeps the result as a letter</text>
<path class="bell" d="M824 508 H499"/><path class="dot-bell" d="M492 508 l10 -5 v10 z"/><circle class="dot-bell" cx="513" cy="493" r="10"/><text class="num" x="513" y="497" text-anchor="middle">6</text><text class="t" x="673" y="498" text-anchor="middle">doorbell {&quot;pending&quot;: 1} · no content</text>
<path class="net" d="M496 570 H821"/><path class="dot-net" d="M828 570 l-10 -5 v10 z"/><circle class="dot-net" cx="493" cy="555" r="10"/><text class="num" x="493" y="559" text-anchor="middle">7</text><text class="t" x="673" y="560" text-anchor="middle">sync · letters and files over the tailnet</text>
<path class="chat" d="M484 632 H159"/><path class="dot-chat" d="M152 632 l10 -5 v10 z"/><circle class="dot-chat" cx="224" cy="617" r="10"/><text class="num" x="224" y="621" text-anchor="middle">8</text><text class="t" x="333" y="622" text-anchor="middle">summary and screenshots</text>
<text class="t m" x="490.0" y="668" text-anchor="middle">Grok Bot never sees the Telegram chat, so it cannot approve its own runs.</text>
<text class="t m" x="490.0" y="690" text-anchor="middle">Results stay on the tailnet. The public webhook only says that mail is waiting.</text>
</svg>
