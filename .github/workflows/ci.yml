name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m compileall -q peerlink tests
      - name: Shell syntax
        run: sh -n examples/tasks/hello/run.sh && sh -n scripts/release-notes.sh
      - name: Tests
        run: python -m unittest discover -s tests
      - name: LaunchAgent template
        if: runner.os == 'macOS'
        run: plutil -lint deploy/local.peerlink.plist
